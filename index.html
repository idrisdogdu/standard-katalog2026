    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.css">
    <style>
        body {
            background-color: #1a1a1a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
        }
        
        #flipbook-wrapper {
            position: relative;
            cursor: pointer;
            /* Performans ve akıcılık için CSS transform kullanıyoruz */
            transition: transform 0.3s ease-out; 
            transform-origin: center center;
        }
        
        #flipbook-container {
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }
        
        .page {
            width: 100%;
            height: 100%;
            background-color: white;
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        /* Zoom açıkken imleç el işaretine dönsün */
        body.zoom-active #flipbook-wrapper {
            cursor: grab;
        }
        body.zoom-active #flipbook-wrapper:active {
            cursor: grabbing;
        }

        #zoom-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            color: #ccc;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>

<div id="zoom-info">Kullanım: <br>Herhangi Bir Yere Çift Tıkla: 2 Kat Yaklaş / Uzaklaş <br>Yaklaşınca: Mouse Sol Tıkla Tut ve Sürükle</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

<script>
    $(document).ready(function() {
        var isZoomed = false;
        var scale = 1;
        var posX = 0, posY = 0;
        var isDragging = false;
        var startX, startY;

        // 1. Flipbook'u Başlat
        $('#flipbook-container').turn({
            width: 1000,          
            height: 700,         
            autoCenter: true,    
            duration: 600
        });

        // 2. Çift Tıklama Olayı (Wrapper düzeyinde kesintisiz algılama)
        $('#flipbook-wrapper').dblclick(function(e) {
            if (isZoomed) {
                // Zoom Kapat
                scale = 1;
                posX = 0;
                posY = 0;
                $(this).css('transform', 'scale(' + scale + ') translate(0px, 0px)');
                $('body').removeClass('zoom-active');
                isZoomed = false;
            } else {
                // Zoom Aç (2 Kat Yaklaş)
                scale = 2;
                $(this).css('transform', 'scale(' + scale + ')');
                $('body').addClass('zoom-active');
                isZoomed = true;
            }
        });

        // 3. Mouse ile Tut-Sürükle (Pan) İşlemi (Sadece Zoom Açıkken)
        $('#flipbook-wrapper').mousedown(function(e) {
            if (!isZoomed) return;
            isDragging = true;
            startX = e.clientX - posX;
            startY = e.clientY - posY;
            return false; 
        });

        $(document).mousemove(function(e) {
            if (!isDragging || !isZoomed) return;
            posX = e.clientX - startX;
            posY = e.clientY - startY;
            
            // Kataloğun ekrandan tamamen çıkıp kaybolmaması için basit sınır kontrolü
            if (posX > 400) posX = 400;
            if (posX < -400) posX = -400;
            if (posY > 300) posY = 300;
            if (posY < -300) posY = -300;

            // CSS translate'i scale ile birlikte vermemiz gerekiyor yoksa zoom bozulur
            $('#flipbook-wrapper').css('transform', 'scale(' + scale + ') translate(' + (posX / scale) + 'px, ' + (posY / scale) + 'px)');
        });

        $(document).mouseup(function() {
            isDragging = false;
        });

        // 4. Klavye Yön Tuşları (Sadece normal boyuttayken çalışır)
        $(window).bind('keydown', function(e){
            if (isZoomed) return; 
            if (e.keyCode == 37) $('#flipbook-container').turn('previous'); 
            if (e.keyCode == 39) $('#flipbook-container').turn('next');     
        });
    });
</script>
